############################################
# PICOM v13
# AMD RX 9070 / Mesa / DWM
# Samsung 40" 5120x2160 @ 144 Hz
############################################


############################################
# BACKEND
############################################

backend = "glx";

vsync = true;

use-damage = true;

unredir-if-possible = true;

############################################
# SHADOWS
############################################

shadow = true;

shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.55;

shadow-color = "#000000";


############################################
# FADING
############################################

fading = true;

fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;


############################################
# CORNERS
############################################

corner-radius = 10;

detect-rounded-corners = true;


############################################
# ANIMATIONS
############################################

animations = (

    # Window opening
    {
        triggers = [ "open" ];
        preset = "appear";
        scale = 0.75;
        duration = 0.30;
    },

    # Window closing
    {
        triggers = [ "close" ];
        preset = "disappear";
        scale = 0.75;
        duration = 0.25;
    },

    # Window becoming visible
    {
        triggers = [ "show" ];
        preset = "slide-in";
        direction = "up";
        duration = 0.20;
    },

    # Window disappearing
    {
        triggers = [ "hide" ];
        preset = "slide-out";
        direction = "down";
        duration = 0.20;
    },

    # DWM window movement / resizing
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.12;
    }

);


############################################
# WINDOW RULES
############################################

rules = (

    # Active window
    {
        match = "focused";
        opacity = 1.0;
    },

    # Inactive windows
    {
        match = "!focused";
        opacity = 0.94;
    },

    # Fullscreen applications
    {
        match = "fullscreen";

        opacity = 1.0;

        shadow = false;

        corner-radius = 0;
    },

    # Desktop
    {
        match = "window_type = 'desktop'";
        shadow = false;
    },

    # Docks / bars
    {
        match = "window_type = 'dock'";
        shadow = false;
    },

    # Menus / popups / tooltips
    {
        match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip'";

        shadow = false;
    }

);
