# Enable 256 colors
set -g default-terminal "screen-256color"
# Enable true color support
set -ga terminal-overrides ",xterm-256color:Tc"

set -g prefix C-s
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

set -g mouse on # sometimes we need the mouse. SAD!

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse
set -g focus-events on
# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0

# resizing
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

# max a pane
bind -r m resize-pane -Z

# Reload config
bind R run-shell "tmux source-file ~/.config/tmux/tmux.conf && tmux display-message 'tmux.conf reloaded like a champion'"

# Set base indices
set-option -g base-index 1
set-option -g pane-base-index 1

# for modern terminal emulators to handle things like Ctrl+Enter in tmux
set -g extended-keys on
set -g extended-keys-format csi-u

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ================================
# Catppuccin Mocha Tmux Theme
# Left status = session
# Center status = windows (active highlighted)
# Right status = current dir
# ================================
# --- Catppuccin Mocha palette ---
BG="#1e1e2e"
FG="#cdd6f4"
ROSEWATER="#f5e0dc"
FLAMINGO="#f2cdcd"
PINK="#f5c2e7"
MAUVE="#cba6f7"
RED="#f38ba8"
MAROON="#eba0ac"
PEACH="#fab387"
YELLOW="#f9e2af"
GREEN="#a6e3a1"
TEAL="#94e2d5"
SKY="#89dceb"
SAPPHIRE="#74c7ec"
BLUE="#89b4fa"
LAVENDER="#b4befe"
SURFACE0="#313244"
SURFACE1="#45475a"
SURFACE2="#585b70"
OVERLAY0="#6c7086"
OVERLAY1="#7f849c"
OVERLAY2="#9498b1"
MANTLE="#181825"
CRUST="#11111b"

# --- Separators (Nerd Font powerline glyphs) ---
HALF_ROUND_OPEN=""
HALF_ROUND_CLOSE=""
TRIANGLE_OPEN=""
TRIANGLE_CLOSE=""

# --- Status bar ---
set-option -g status on
set-option -g status-style "bg=$BG,fg=$FG"
set-option -g status-interval 1
set-option -g status-justify centre
set-option -g status-left-length 100
set-option -g status-right-length 150

# Pane borders
set-option -g pane-border-style "fg=$OVERLAY0"
set-option -g pane-active-border-style "fg=$BLUE"

# Optional: pane labels
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# Background dim for panes that don't fully repaint
set-option -g window-style "bg=$CRUST"
set-option -g window-active-style "bg=$BG"

# --- Messages ---
set-option -g message-style "bg=$BG,fg=$YELLOW"
set-option -g message-command-style "bg=$BG,fg=$YELLOW"

# --- Pane numbers ---
set-option -g display-panes-active-colour "$YELLOW"
set-option -g display-panes-colour "$BLUE"

# --- Left status: session name ---
set-option -g status-left "#[bg=default,fg=$SURFACE1]${HALF_ROUND_OPEN}#[bg=$SURFACE1,fg=$MAUVE,bold] #S #[bg=$BG,fg=$SURFACE1]${TRIANGLE_CLOSE}"

# --- Right status: current directory ---
set-option -g status-right "#[bg=$BG,fg=$SURFACE1]${TRIANGLE_OPEN}#[bg=$SURFACE1,fg=$TEAL,bold] #{pane_current_path} #[bg=default,fg=$SURFACE1]${HALF_ROUND_CLOSE}"

# --- Inactive windows ---
set-window-option -g window-status-separator ""
set-window-option -g window-status-format " #[fg=$FG,bg=$BG]#I#[fg=$PINK,bg=$BG] #[fg=$FG,bg=$BG]#W "

# --- Active window ---
set-window-option -g window-status-current-format " #[fg=$BLUE,bg=$BG]${HALF_ROUND_OPEN}#[bg=$BLUE,fg=$BG,bold]#I#[fg=$PINK,bg=$BLUE] #[fg=$BG,bg=$BLUE]#W#[fg=$BLUE,bg=$BG]${HALF_ROUND_CLOSE}"

# --- Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf) ---
run '~/.config/tmux/plugins/tpm/tpm'
